name: BiliMusic
options:
  bundleIdPrefix: com.fubuki
  deploymentTarget:
    iOS: "26.0"
fileGroups:
  # 仅显示在 Xcode Project Navigator，不加入任何 target 或 App bundle。
  - docs
packages:
  LNPopupUI:
    path: Vendor/LNPopupUI
targets:
  BiliMusic:
    type: application
    platform: iOS
    sources:
      - path: BiliMusic
        excludes:
          - "**/CLAUDE.md"
    dependencies:
      - package: LNPopupUI
    # 签名 Team ID 不入库：各自维护本地 Local.xcconfig（见 Local.xcconfig.example）
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: BiliMusic
        PRODUCT_BUNDLE_IDENTIFIER: $(BILIMUSIC_BUNDLE_ID)
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: BiliMusic/Info.plist
      properties:
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        CADisableMinimumFrameDurationOnPhone: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  BiliMusicTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BiliMusicTests]
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    dependencies:
      - target: BiliMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BILIMUSIC_BUNDLE_ID).Tests
        SWIFT_VERSION: "5.10"
        CODE_SIGNING_ALLOWED: NO
  BiliMusicUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BiliMusicUITests]
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    dependencies:
      - target: BiliMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BILIMUSIC_BUNDLE_ID).UITests
        SWIFT_VERSION: "5.10"
        CODE_SIGNING_ALLOWED: NO
